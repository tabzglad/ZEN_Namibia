# global settings
source_path: "./data/raw_data"

# all settings in the system.yaml file with the exception of technology lists
system:
  set_nodes:
    - NAM
    - ZAF
    - ZMB
    - ZWE
  reference_year: 2023
  unaggregated_time_steps_per_year: 8760
  # Time-series aggregation: the 8760 hours are clustered into this many
  # representative hours (e.g. 500-2000; more is slower but closer to 8760). Storage levels
  # still follow the full year in order. Set conduct_time_series_aggregation
  # to false to solve all 8760 hours.
  aggregated_time_steps_per_year: 2000
  conduct_time_series_aggregation: true
  # 2023 (calibrated fleet, no new capacity) and 2030 (demand growth from
  # NIRP 2.7%/yr after 2025; committed projects plus optional investment).
  optimized_years: 2
  interval_between_years: 7
  use_rolling_horizon: false
  years_in_rolling_horizon: 1
  # New capacity only after 2023 (capacity limits per year, zen_namibia/utils.py).
  allow_investment: true

# add technologies/carriers to the model (resolved to the custom classes in zen_namibia/elements/)
# Imports and exports enter Namibia (NAM) only through the power_line
# interconnectors from South Africa (ZAF) and Zambia (ZMB); Zimbabwe (ZWE)
# is connected to Zambia through the Kariba link.
# Natural gas is omitted until the model has sourced 2023 capacity and fuel data.
elements:
  insert:
    energy_system: energy_system_namibia
    set_carriers:
      - electricity
      - coal
      - hfo
      - biomass
      - hydrogen
    set_conversion_technologies:
      - photovoltaics
      - onshore_wind_turbine
      - hydro_turbine
      - anixas_i
      - coal_steam_turbine
      - engine_power_plant
      - biomass_power_plant
      - electrolyser
    set_storage_technologies:
      - battery
      - hydrogen_storage
    set_transport_technologies:
      - power_line

# settings that go into the energy_system folder
energy_system:
  units:
    base_units:
      - hour
      - MW
      - km
      - kilotons
      - Euro

    definitions:
      Euro:
        dimension: currency
        aliases:
          - EURO
          - Eur

